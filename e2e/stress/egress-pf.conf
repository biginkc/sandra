# OS-level egress denial for the stubbed leg (macOS pf). Outer ring; the in-process guard is the inner ring.
# Do not load this file by hand: `e2e/stress/egress-pf.sh apply` renders __UID__ and loads it.
#
# Why it looks like this (each line was wrong in the first version):
#  - It lives in the anchor `com.apple/sandra-stress`. macOS's /etc/pf.conf only evaluates anchors under
#    `com.apple/*`; an anchor named `com.apple.sandra-stress` is never consulted, so nothing was blocked.
#  - `set skip on lo0` is an option; options are not allowed inside an anchor. Loopback is passed by a rule.
#  - `block ... all` blocked the WHOLE machine, including the agent driving the run. Rules are scoped to the
#    one uid the harness runs as (`user` matches tcp/udp only; that covers HTTP(S) and DNS, which is all a
#    provider call needs). ICMP is irrelevant to providers and left alone.
# The label lets the harness read per-rule counters. No address family = both inet and inet6. ICMP cannot be tied to a uid in pf and is out of scope.
# Blocked packets are LOGGED to pflog0 (`sudo tcpdump -n -e -ttt -i pflog0`): the firewall log the plan fails the run on.
pass quick on lo0 all
block drop out log quick proto { tcp, udp } from any to any user __UID__ label "sandra-stress-egress"
