# OS-level egress allowlist for the stubbed leg (macOS pf). Outer ring; loopback only.
# Apply (root's context, needs sudo), run, then remove:
#   sudo pfctl -a com.apple.sandra-stress -f e2e/stress/egress-pf.conf && sudo pfctl -e
#   ...run the harness with STRESS_REQUIRE_OS_EGRESS=1...
#   sudo pfctl -a com.apple.sandra-stress -F all
# Every non-loopback packet from this user is blocked and LOGGED to pflog0 (tcpdump -n -e -ttt -i pflog0),
# which is the "firewall log" the plan fails the run on.
set skip on lo0
block drop out log quick all
