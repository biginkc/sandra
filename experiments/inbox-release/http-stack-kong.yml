_format_version: "1.1"

# Disposable release fixture only. Keep this file free of keys and tokens.
# Realtime's Phoenix socket is mounted below /socket; the route must retain
# that upstream prefix or /realtime/v1/websocket becomes an upstream 404.
services:
  - name: release-auth
    url: http://auth:9999/
    routes:
      - name: release-auth-v1
        strip_path: true
        paths:
          - /auth/v1/
  - name: release-rest
    url: http://rest:3000/
    routes:
      - name: release-rest-v1
        strip_path: true
        paths:
          - /rest/v1/
  - name: release-realtime
    url: http://realtime:4000/socket
    routes:
      - name: release-realtime-v1
        strip_path: true
        paths:
          - /realtime/v1/
