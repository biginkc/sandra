name: Norma stress gate

# PLAN.md section 9: the Have Norma call stress gate (misbehaving fake Bland,
# seeded randomised lifecycles with concurrent events, barrier-forced races,
# the 20-press button hammer). No real Bland, Slack or AI; nobody is dialled.
#
# It needs a real Postgres with the Sandra schema, because its whole point is
# many separate connections racing for real. It provisions the same disposable
# local Supabase stack the other heavy lanes use (scripts/ci/provision-
# disposable-stack.mjs; hosted credentials are refused there), WITHOUT the Norma
# migrations, then clones that schema into a scratch database, replays the Norma
# migrations there and drops it afterwards.
#
# pg_dump/psql 17 come from ankane/setup-postgres (the runner's own client is
# older than the server and pg_dump refuses to run against a newer server).
#
# Explicit combined job: immutable e94 schema checkout runs131 legacy,10
# post-DDL hazards and20 upgrade cases. This assembled checkout runs the full
# paired176 suite and19 maintenance/authentication controls on the same dump.
# The schema-only entry remains fixed and refuses assembled runtime hashes.
# A failing seed is printed; replay it with
#   NORMA_STRESS_SEED=<seed> npm run test:norma-stress

on:
  pull_request:
    paths:
      - "src/lib/norma/**"
      - "src/lib/sequences/enrollment.ts"
      - "src/lib/messaging/inbound.ts"
      - "src/app/api/webhooks/bland/**"
      - "src/app/api/cron/**"
      - "supabase/migrations/*_norma_*"
      - "vitest.norma-stress.config.ts"
      - "vitest.local-integration.config.ts"
      - "src/lib/testing/loopback-postgres-url.ts"
      - "scripts/ci/*norma*"
      - "package.json"
      - ".gitattributes"
      - "scripts/ci/provision-disposable-stack.mjs"
      - ".github/workflows/norma-stress.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  norma-stress:
    name: Norma stress gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: ankane/setup-postgres@e9cd5bc1babecb0e441a640646d782056dbb67f5
        with:
          postgres-version: 17

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - run: npm ci

      - name: Provision disposable stack (schema without the Norma migrations)
        run: node scripts/ci/provision-disposable-stack.mjs --api-port 55421 --db-port 55422 --no-baseline-owner --exclude-migrations '*_norma_*'

      - name: Prepare only the owned disposable Norma fixture admin
        run: node scripts/ci/prepare-norma-fixture.mjs

      - name: Validate the explicit combined contract runner
        run: npm run test:norma-combined-contract-unit

      - name: Run immutable schema and full assembled paired/maintenance lanes
        env:
          NORMA_STRESS_SOURCE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
        run: npm run test:norma-combined-contract -- --output-directory "$RUNNER_TEMP/norma-combined-contract"

      - name: Stop disposable stack
        if: always() && env.E2E_LOCAL_WORKDIR != ''
        run: supabase stop --workdir "$E2E_LOCAL_WORKDIR" --no-backup

      - name: Preserve contract receipts (no schema dump)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norma-combined-contract
          path: |
            ${{ runner.temp }}/norma-combined-contract/*.json
            ${{ runner.temp }}/norma-combined-contract/databases/*.json
            ${{ runner.temp }}/norma-combined-contract/*.log
            ${{ runner.temp }}/norma-combined-contract/legacy-schema/*.json
            ${{ runner.temp }}/norma-combined-contract/legacy-schema/databases/*.json
            ${{ runner.temp }}/norma-combined-contract/legacy-schema/*.log
          if-no-files-found: warn
