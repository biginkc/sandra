name: Verify

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [main, codex/esign-release-e2e-contracts-20260912, codex/sequence-readiness-20260917]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and unit/RTL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - uses: ankane/setup-postgres@e9cd5bc1babecb0e441a640646d782056dbb67f5
        with:
          postgres-version: 17

      - name: Install dependencies
        run: npm ci

      # Dialpad call audio v1 promises the existing artifact sweep stays byte-identical. This guard only applies to
      # that PR's branch; the same promise for schemaReady('artifact_fetch') is asserted in
      # src/lib/my-leads/schema-ready-dialpad-call-audio.test.ts.
      - name: Artifact sweep is untouched (dialpad-call-audio)
        if: github.event_name == 'pull_request' && github.head_ref == 'claude/dialpad-call-audio'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --exit-code "origin/${{ github.base_ref }}" -- \
            src/lib/dialpad-cti/artifact-fetch.ts src/lib/dialpad-cti/artifact-fetch.test.ts src/app/api/cron/dialpad-artifact-sweep

      - name: Verify standalone direct coaching service
        working-directory: services/direct-coach
        run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run build

      - name: Rehearse My Leads metrics and signed call evidence
        run: node scripts/verify-my-leads-metrics.mjs && node scripts/rehearse-call-metrics-writeback.mjs

      - name: Rehearse rep SMS assignments and queue authorization
        run: node scripts/verify-rep-sms.mjs

      - name: Rehearse recording library authorization and catalog
        env:
          SANDRA_POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: node scripts/rehearse-recording-library.mjs

      - name: Rehearse Slack preview authorization and durable delivery
        env:
          SANDRA_POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: node scripts/rehearse-slack-unfurls.mjs

      - name: Run verify
        env:
          SUPABASE_LOCAL_DB_URL: postgresql://runner@localhost:5432/postgres
          # tsc on this repo now exceeds Node's default ~4 GB heap (OOM at
          # 2026-10-07 run 37656511086); ubuntu-latest runners have 7 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run verify

      - name: Run chaos-harness guard unit tests (loopback only, no providers)
        run: npm run test:stress-unit

      - name: Run database-free synthetic Playwright gates
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:e2e:synthetic

  hugo-postgres:
    name: Hugo lifecycle migrations on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ankane/setup-postgres@e9cd5bc1babecb0e441a640646d782056dbb67f5
        with:
          postgres-version: 17

      - name: Replay Hugo lifecycle migrations and rollback
        env:
          SANDRA_POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: npm run verify:hugo-sql && npm run verify:hugo-rollback

      - name: Rehearse bounded Leads urgency counts
        run: npm run verify:leads-urgency-sql
