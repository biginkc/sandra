name: Inbox reconciliation integration

on:
  pull_request:
    paths:
      - ".github/workflows/inbox-reconcile.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/provision-disposable-stack.mjs"
      - "scripts/inbox-reconcile-completion.README.md"
      - "scripts/inbox-reconcile-completion.integration.test.mjs"
      - "scripts/inbox-reconcile-completion.mutation.mjs"
      - "scripts/inbox-reconcile-completion.mjs"
      - "scripts/inbox-reconcile-catalog.expected.json"
      - "supabase/config.toml"
      - "supabase/migrations/20260930040000_inbox_control_foundation.sql"
      - "supabase/migrations/20260930040100_inbox_read_companion.sql"
      - "supabase/migrations/20260930040200_inbox_backend_operation_reply.sql"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: inbox-reconcile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: R6a against repo migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: "true"
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Provision disposable Supabase/Postgres 17 stack
        run: node scripts/ci/provision-disposable-stack.mjs --api-port 55421 --db-port 55422 --no-baseline-owner

      - name: Run R6a integration and mutation guards
        run: INBOX_RECONCILIATION_TEST_DATABASE_URL="$E2E_CI_SUPABASE_DB_URL" npm run test:inbox-reconcile

      - name: Kill M1 and serving-enabled mutants
        run: INBOX_RECONCILIATION_TEST_DATABASE_URL="$E2E_CI_SUPABASE_DB_URL" npm run test:inbox-reconcile-mutations

      - name: Destroy disposable stack
        if: always() && env.E2E_LOCAL_WORKDIR != ''
        run: supabase stop --workdir "$E2E_LOCAL_WORKDIR" --no-backup
