name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize all E2E runs against the shared Supabase test project so concurrent
# runs (PR push + main push, two PRs landing back-to-back, etc.) can't truncate
# each other's fixtures mid-test. cancel-in-progress: false means later runs
# queue and wait, rather than killing the running job.
#
# Root cause confirmed by Codex investigation 2026-05-07: cockpit/notifications
# flakes on PR #130's first CI run were caused by E2E runs overlapping against
# the same TEST_SUPABASE project — one run's reset_tenant_tables() wiped rows
# the other had just seeded. Symptoms looked like compile-penalty from a static
# import; the static import was a red herring (PR #131 lazy-load workaround
# was withdrawn).
concurrency:
  group: e2e-shared-test-project
  cancel-in-progress: false
  queue: max

jobs:
  playwright:
    name: Playwright golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: e2e-ci

    env:
      E2E_CI_SUPABASE_PROJECT_REF: ${{ vars.E2E_CI_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SOFTPHONE_TRANSPORT: "simulated"
      # Skip the Haiku intent classifier in e2e — no ANTHROPIC_API_KEY here,
      # and the classifier is already unit-tested in
      # src/lib/leads/classify-reply-intent.test.ts. The webhook reads this
      # and short-circuits to shouldQualify=true so the qualify path is
      # exercised end-to-end. See dialpad/sms/route.ts.
      SKIP_INTENT_GATE: "1"
      CI: "1"
      # GitHub-hosted Ubuntu runners already include Google Chrome. Use it in
      # CI to avoid the Playwright browser download/install step, which can hang
      # before tests begin.
      PLAYWRIGHT_BROWSER_CHANNEL: "chrome"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate job-scoped E2E identity
        run: npx tsx scripts/e2e-identity-lifecycle.ts emit

      - name: Preflight E2E identity and arm browser-QA circuit breaker
        run: npx tsx scripts/e2e-identity-lifecycle.ts preflight
        env:
          TEST_SUPABASE_URL: ${{ secrets.E2E_CI_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_CI_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify Chrome browser
        run: |
          google-chrome --version
          node - <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run Playwright E2E suite
        env:
          TEST_SUPABASE_URL: ${{ secrets.E2E_CI_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.E2E_CI_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_CI_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Bound each serial group to a fresh Next dev server. Beyond roughly
          # six minutes the CI server has emitted ECONNRESET and stopped
          # committing otherwise-valid RSC interactions. Three disjoint broad
          # shards keep all assertions while preventing that lifecycle leak.
          npm run test:e2e -- --grep-invert 'Leads board v2 foundation is usable at desktop and narrow widths|switching tabs preserves URL state|sidebar nav links all route correctly' --shard=1/3
          npm run test:e2e -- --grep-invert 'Leads board v2 foundation is usable at desktop and narrow widths|switching tabs preserves URL state|sidebar nav links all route correctly' --shard=2/3
          npm run test:e2e -- --grep-invert 'Leads board v2 foundation is usable at desktop and narrow widths|switching tabs preserves URL state|sidebar nav links all route correctly' --shard=3/3
          # Keep the navigation-heavy Leads board contract on its own fresh
          # Turbopack server. Run the two client-navigation contracts against
          # Webpack: GitHub's Turbopack dev runtime returns valid RSC payloads
          # for these clicks but intermittently never commits them in Chrome.
          # The larger timeout covers Webpack's cold compilation of 11 routes;
          # the click and URL assertions remain unchanged.
          npm run test:e2e -- --grep 'Leads board v2 foundation is usable at desktop and narrow widths'
          PLAYWRIGHT_WEBPACK_DEV_SERVER=1 npm run test:e2e -- --grep 'switching tabs preserves URL state|sidebar nav links all route correctly' --timeout=120000

      - name: Clean up exact-run E2E identities and verify browser-QA isolation
        if: always()
        run: npx tsx scripts/e2e-identity-lifecycle.ts cleanup
        env:
          TEST_SUPABASE_URL: ${{ secrets.E2E_CI_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_CI_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
