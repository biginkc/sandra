name: E2E

on:
  push:
    branches: [main, codex/esign-release-e2e-contracts-20260912]
  pull_request:
    branches: [main]

# Each job owns a disposable database on its GitHub runner. Hosted legacy
# branches keep their shared-project queue; these jobs cannot reach that DB.
permissions:
  contents: read
  packages: read

jobs:
  playwright:
    name: Playwright golden paths
    runs-on: ubuntu-latest
    # Five serial server runs exceeded 25 minutes in two observed CI attempts.
    # Preserve all tests and per-test limits; allow the full suite to finish.
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SOFTPHONE_TRANSPORT: "simulated"
      # Skip the Haiku intent classifier in e2e — no ANTHROPIC_API_KEY here,
      # and the classifier is already unit-tested in
      # src/lib/leads/classify-reply-intent.test.ts. The webhook reads this
      # and short-circuits to shouldQualify=true so the qualify path is
      # exercised end-to-end. See dialpad/sms/route.ts.
      SKIP_INTENT_GATE: "1"
      CI: "1"
      # GitHub-hosted Ubuntu runners already include Google Chrome. Use it in
      # CI to avoid the Playwright browser download/install step, which can hang
      # before tests begin.
      PLAYWRIGHT_BROWSER_CHANNEL: "chrome"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Provision disposable E2E database
        run: node scripts/provision-e2e-local-database.mjs

      - name: Generate job-scoped E2E identity
        run: npx tsx scripts/e2e-identity-lifecycle.ts emit

      - name: Preflight E2E identity and arm browser-QA circuit breaker
        run: npx tsx scripts/e2e-identity-lifecycle.ts preflight
      - name: Verify inbox drip snapshot migration on disposable database
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
        run: npx vitest run --config vitest.integration.config.ts supabase/migrations/20260928120000_messages_drip_snapshot.integration.test.ts
      - name: Verify needs-person counts and latest enrollment on disposable database
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
        run: npx vitest run --config vitest.integration.config.ts supabase/migrations/20260929190000_sequence_stats.integration.test.ts
      - name: Verify Chrome browser
        run: |
          google-chrome --version
          node - <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run Playwright E2E suite
        run: |
          # Keep real thread-detail loading and read receipts on a fresh
          # server; the shared run stalled these requests before mark-read.
          npm run test:e2e -- e2e/cockpit-thread-panel.spec.ts
          # Keep the sequence readiness contract on its own fresh server.
          # The long shared shard can lose its Next/RSC stream after several
          # minutes, which also takes down the local ledger used by these
          # tests and turns valid sequence assertions into ECONNREFUSED.
          TEST_SUPABASE_DB_URL="$E2E_CI_SUPABASE_DB_URL" npx playwright test --config playwright.sequence-readiness.config.ts
          # Bound each serial group to a fresh Next dev server. Beyond roughly
          # six minutes the CI server has emitted ECONNRESET and stopped
          # committing otherwise-valid RSC interactions. Three disjoint broad
          # shards keep all assertions while preventing that lifecycle leak.
          npm run test:e2e -- --grep-invert 'sequence readiness|server-side egress guard records denial before network in local ledger|Leads board v2 foundation is usable at desktop and narrow widths|switching tabs preserves URL state|sidebar nav links all route correctly|long thread scrolls to most recent on open|opening a thread clears its unread badge' --shard=1/3
          npm run test:e2e -- --grep-invert 'sequence readiness|server-side egress guard records denial before network in local ledger|Leads board v2 foundation is usable at desktop and narrow widths|switching tabs preserves URL state|sidebar nav links all route correctly|long thread scrolls to most recent on open|opening a thread clears its unread badge' --shard=2/3
          npm run test:e2e -- --grep-invert 'sequence readiness|server-side egress guard records denial before network in local ledger|Leads board v2 foundation is usable at desktop and narrow widths|switching tabs preserves URL state|sidebar nav links all route correctly|long thread scrolls to most recent on open|opening a thread clears its unread badge' --shard=3/3
          # Keep the navigation-heavy Leads board contract on its own fresh
          # Turbopack server. Run the two client-navigation contracts against
          # Webpack: GitHub's Turbopack dev runtime returns valid RSC payloads
          # for these clicks but intermittently never commits them in Chrome.
          # The larger timeout covers Webpack's cold compilation of 11 routes;
          # the click and exact-URL predicates still must succeed.
          npm run test:e2e -- --grep 'Leads board v2 foundation is usable at desktop and narrow widths'
          PLAYWRIGHT_WEBPACK_DEV_SERVER=1 npm run test:e2e -- --grep 'switching tabs preserves URL state|sidebar nav links all route correctly' --timeout=240000

      - name: Clean up exact-run E2E identities and verify browser-QA isolation
        if: always()
        run: npx tsx scripts/e2e-identity-lifecycle.ts cleanup
      - name: Verify SMS delivery and opening identity on disposable database
        # Preserve delivery evidence even when an unrelated browser assertion
        # fails. This stack is owned by this job and has finished browser use.
        if: ${{ !cancelled() && env.E2E_DISPOSABLE_DATABASE == '1' }}
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
        run: npx vitest run --config vitest.integration.config.ts src/lib/messaging/send.integration.test.ts

      - name: Verify eSign canary lease on disposable database
        if: success()
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
        run: npx vitest run --config vitest.integration.config.ts supabase/migrations/20260914235900_esign_canary_lease.integration.test.ts
      - name: Verify coach script cache migration on disposable database
        if: success()
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
        run: npx vitest run --config vitest.integration.config.ts supabase/migrations/20260926100000_coach_script_cache.integration.test.ts
      - name: Destroy disposable E2E database
        if: always() && env.E2E_LOCAL_WORKDIR != ''
        run: supabase stop --workdir "$E2E_LOCAL_WORKDIR" --no-backup

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  search-local-suites:
    name: Search RPC, oracle and composition suites (disposable DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # The legacy-isolation guard diffs against the merge-base with origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Owns its own disposable database on this runner (loopback only). The
      # suites below call the local-only guard and refuse any other target.
      - name: Provision disposable database
        run: node scripts/provision-e2e-local-database.mjs

      - name: Legacy Prospects actions are untouched (git diff vs merge-base)
        run: |
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --exit-code "$base" -- \
            "src/app/(dashboard)/properties/actions.ts" \
            "src/app/(dashboard)/properties/dnc-safe-actions.ts" \
            "src/app/(dashboard)/properties/promote-leads-actions.ts" \
            "src/app/(dashboard)/properties/_actions/count.ts" \
            "src/app/(dashboard)/leads/actions.ts" \
            "src/app/(dashboard)/campaigns/actions.ts" \
            src/lib/prospects/eligibility.ts \
            src/lib/messaging/bulk-queue.ts \
            src/workflows/bulk-sms.ts

      - name: Search oracle reference matcher (unit)
        run: npm run test:search-oracle

      - name: search_properties RPC and independent oracle comparison
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:search-local

      - name: My Leads single-row lookup RPC (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261003120000_my_leads_queue_row_lookup.integration.test.ts

      - name: My Leads housekeeping tables and gate (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005100000_my_leads_housekeeping_tools.integration.test.ts

      - name: My Leads housekeeping reassign and rollback (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005100100_my_leads_housekeeping_reassign.integration.test.ts

      - name: My Leads attempt outcome widening and close-out (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005110000_acquisition_attempt_outcome_voicemail_not_logged.integration.test.ts

      - name: My Leads next-step schema and flags (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005120000_next_step_schema.integration.test.ts

      - name: My Leads fn_create_next_step (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005120500_fn_create_next_step.integration.test.ts

      - name: My Leads next-step read model (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005121000_next_step_read_model.integration.test.ts

      - name: My Leads mode-aware calendar lifecycle (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005121200_next_step_mode_aware_lifecycle.integration.test.ts

      - name: My Leads relabel, mode and retire preflight functions (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005121500_next_step_relabel_functions.integration.test.ts

      - name: My Leads reassign explicit sources (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005122000_my_leads_housekeeping_reassign_sources.integration.test.ts

      - name: My Leads reassign queue-state scope (disposable DB)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261005140000_my_leads_housekeeping_reassign_queue_scope.integration.test.ts

      - name: "My Leads lead_comps foundation - RLS, enqueue, cap ledger (disposable DB)"
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261007100000_lead_comps_foundation.integration.test.ts

      - name: "My Leads contract defaults - RLS, empty defaults, rollback (disposable DB)"
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run --config vitest.local-integration.config.ts supabase/migrations/20261007160000_acquisition_contract_defaults.integration.test.ts

      - name: My Leads housekeeping operator script (unit)
        run: node --test scripts/my-leads-housekeeping.test.mjs

      # Every SQL mutation must be caught by the RPC suite: a surviving mutation means a test gap.
      - name: search_properties mutation harness (each mutation must fail the suite)
        env:
          TEST_SUPABASE_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          LOCAL_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          LOCAL_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          LOCAL_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # No-op mutations (a regex that stopped matching) fail here, before any suite run.
          npx tsx scripts/check-search-mutations.ts
          names="$(npx tsx -e 'console.log(require("./tests/search-oracle/sql-mutations").MUTATION_NAMES.join(" "))')"
          test -n "$names" || { echo "::error::no mutations listed"; exit 1; }
          for m in $names; do
            if SEARCH_PROPS_MUTATION="$m" npx vitest run --config vitest.local-integration.config.ts \
                 supabase/migrations/20261002110100_search_properties.integration.test.ts > "mutation-$m.log" 2>&1; then
              echo "::error::mutation $m SURVIVED (the suite passed against broken SQL)"; tail -20 "mutation-$m.log"; exit 1
            fi
            # A harness/setup crash is not a kill: require real failing assertions.
            sed 's/\x1b\[[0-9;]*m//g' "mutation-$m.log" > "mutation-$m.plain.log"
            if ! grep -qE "Tests +[0-9]+ failed" "mutation-$m.plain.log"; then
              echo "::error::mutation $m crashed the harness instead of failing tests"; tail -30 "mutation-$m.log"; exit 1
            fi
            echo "mutation $m killed: $(grep -E 'Tests ' "mutation-$m.plain.log" | head -1)"
          done

      - name: Search x filter composition and evaluation budget
        env:
          FILTER_LOCAL_DB_URL: ${{ env.E2E_CI_SUPABASE_DB_URL }}
          FILTER_LOCAL_API_URL: ${{ env.TEST_SUPABASE_URL }}
          FILTER_LOCAL_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          FILTER_LOCAL_SERVICE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:search-filter-local

      - name: Destroy disposable database
        if: always() && env.E2E_LOCAL_WORKDIR != ''
        run: supabase stop --workdir "$E2E_LOCAL_WORKDIR" --no-backup
