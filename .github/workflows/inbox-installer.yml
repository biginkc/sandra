name: Inbox installer checks

on:
  pull_request:
    paths:
      - 'experiments/inbox-production-install/**'
      - '.github/workflows/inbox-installer.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/inbox-production-install/**'
      - '.github/workflows/inbox-installer.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # DB-less determinism gate: source-manifest hash check, ast-parse every
      # .py in the bundle (catches a syntax error in the new composite-type
      # parsing code before it ever reaches a real catalog), then recompile
      # build.py + read-companion.py from the hash-pinned source.
      #
      # This deliberately does NOT invoke `verify.py` itself (with or
      # without --installed): this repo currently carries a recorded
      # forward-correction (hardening-evidence.json) that makes even a
      # no-DB `verify.py` invocation require --installed to pass (see the
      # RuntimeError at verify.py's foundation-hash-drift check) -- so
      # `verify.py` cannot run to completion here at all today, independent
      # of this gate's own change. Replicating just its DB-less prefix here
      # keeps this job green while still exercising the compiler layer.
      - name: Source-manifest + compiler determinism (DB-less)
        working-directory: experiments/inbox-production-install
        run: |
          python3 - <<'PY'
          import ast,hashlib,json,subprocess,sys
          from pathlib import Path
          P=Path('.')
          manifest=json.loads((P/'source-manifest.json').read_text())
          for name,digest in manifest.items():
           actual=hashlib.sha256((P/name).read_bytes()).hexdigest()
           if actual!=digest:
            print(f'Bundle source manifest drift: {name}',file=sys.stderr);sys.exit(1)
          for f in P.glob('*.py'):
           ast.parse(f.read_text(),filename=str(f))
          subprocess.run([sys.executable,'build.py'],check=True)
          subprocess.run([sys.executable,'read-companion.py'],check=True)
          print('Source-manifest hashes match, all bundle .py files parse, compiler is deterministic with no DB.')
          PY
      # --- verify.py's own comparison LOGIC now actually runs in CI (Astra
      # round-2 gate on G2/#585: "green CI doesn't certify verifier
      # integrity" -- this closes that for the two classes just fixed).
      # `verify.py --selftest` calls the real, unmodified bool_ast /
      # bool_ast_repr / strip_whole_argument_parens functions (the exact
      # code verify.py --installed uses for every CHECK/index WHERE-clause
      # comparison) against fixed inputs -- for the arithmetic-regrouping
      # case, REAL pg_get_constraintdef() output captured from the owned T2
      # fixture's inbox_bridge.worksets_check, not synthetic text -- and
      # against the STRICT source-attribute regex. It asserts BOTH that a
      # correctly-installed live constraint still compares equal to source
      # (no false positive from Postgres's own cosmetic re-wrapping) AND
      # that a genuinely regrouped one does not (the gap Astra found). This
      # needs no database at all, so it runs on every PR unconditionally.
      - name: verify.py comparison-logic selftest (DB-less)
        working-directory: experiments/inbox-production-install
        run: python3 verify.py --selftest
      # --- --installed / verify-mutation-harness.py --owned-fixture (24
      # cases, including the two above at the live-catalog level) are still
      # NOT run here. Both require fixture_db.py's guard(), which -- by
      # design (experiments/inbox-projection/fixture/guards.py) -- pins an
      # EXACT local container id + image digest + network-isolated
      # (NetworkMode=none), resource-capped Docker container that only
      # exists on one operator machine, and the owned fixture's full
      # installed catalog (26 tables, 82 functions, real GoTrue Auth, the
      # base Sandra app schema, pg_cron, supabase_admin/anon/authenticated/
      # service_role roles) has no CI-portable equivalent -- reproducing it
      # from a vanilla CI-provisioned Postgres would mean bootstrapping
      # effectively all of Sandra's existing schema plus Supabase
      # infrastructure, which is a separate, explicitly out-of-scope
      # redesign of fixture_db.py / guards.py for CI-portability, not
      # something this gate's fix can absorb.
      #
      # Until that redesign exists, the live-catalog mutation-harness proof
      # for this gate is produced locally and recorded in
      # verify-mutation-harness-evidence.json (committed with each change,
      # currently 24 cases including function_strict_drift and
      # check_constraint_arithmetic_regrouping); the selftest step above is
      # the automated CI backstop for the logic those two new cases exercise.
      - name: Record known CI scope gap
        run: |
          echo "verify.py --installed and verify-mutation-harness.py --owned-fixture (live-catalog proof, 24 cases) require the locally-pinned T2 fixture (see guards.py) and are not run in this job; verify.py --selftest above is the DB-less logic-level backstop for the two classes fixed in this PR. See workflow comments." >> "$GITHUB_STEP_SUMMARY"
