name: Sequences V1 Prod Canary
run-name: Sequences V1 Prod Canary ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}

permissions:
  actions: read
  contents: read
  packages: read

# Runs the same `scripts/smoke-sequences-prod.ts` that proved the pipe
# end-to-end in prod, daily on weekdays. Deliberately hosted on GitHub
# Actions rather than inside Vercel cron so the canary isn't gated on
# the same infra it's monitoring — a Vercel-wide cron outage would
# silently break BOTH the Sequences tick AND an in-Vercel canary,
# giving us the worst possible signal.
#
# Failure mode: exit code non-zero → red run + email to repo watchers.
# Success proves the exact Sendillo message and authenticated delivery webhook.
# The script cleans up only its sequence, step, enrollment, and linked messages.
# The owner-provisioned property, contact, and consent remain permanent.
#
# Cost: one Sendillo outbound SMS per enabled run.
# Dispatch guard requires SEQUENCE_CANARY_USER_ID, SEQUENCE_CANARY_PROPERTY_ID,
# and SEQUENCE_CANARY_CONTACT_ID in BOTH GitHub secrets and Vercel production env.
# Every non-successful full run since the last clean success, including earlier
# attempts, needs acknowledgement in public.sequence_canary_controls.
# Operators use the service-role-only setter documented in the runbook.
# CANARY_GITHUB_READ_TOKEN is for the deployed Vercel app only: fine-grained
# PAT for this repository, Actions: read. The runner uses github.token.
# The repository schedule variable remains a coarse job-level skip gate.
# The DB flag is authoritative and is checked fresh before enrollment and send.
# A skipped or cancelled wrong-block needs acknowledgement until live samples
# confirm the run conclusion and job started_at field values.

on:
  schedule:
    # Weekdays at 14:17 UTC = 08:17 or 09:17 America/Chicago. Early
    # enough that any failure surfaces before the workday really kicks
    # off, late enough that we're not alerting anyone at 5am.
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only runner check or full canary send"
        type: choice
        options: [preflight-only, full]
        default: preflight-only
      message_id:
        description: "Existing message UUID for preflight-only"
        type: string
      webhook_event_id:
        description: "Existing webhook_events UUID for preflight-only"
        type: string

jobs:
  canary:
    name: Sequences V1 Prod Canary
    if: ${{ github.event_name != 'schedule' || vars.SEQUENCE_CANARY_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: sequence-canary-prod
      queue: max
      cancel-in-progress: false

    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prod Supabase URL + service-role key. Stored as GitHub repo
      # secrets so the canary works without any dependency on a
      # developer's local `.env.local`.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      SEQUENCE_CANARY_USER_ID: ${{ secrets.SEQUENCE_CANARY_USER_ID }}
      SEQUENCE_CANARY_PROPERTY_ID: ${{ secrets.SEQUENCE_CANARY_PROPERTY_ID }}
      SEQUENCE_CANARY_CONTACT_ID: ${{ secrets.SEQUENCE_CANARY_CONTACT_ID }}
      CANARY_APPROVED_SENDILLO_API_KEY: ${{ secrets.CANARY_APPROVED_SENDILLO_API_KEY }}
      CANARY_ADMIN_ACCESS_TOKEN: ${{ secrets.CANARY_ADMIN_ACCESS_TOKEN }}
      CANARY_PRODUCTION_DEPLOYMENT_URL: ${{ vars.CANARY_PRODUCTION_DEPLOYMENT_URL }}
      CANARY_PRODUCTION_ALIAS_HOST: ${{ vars.CANARY_PRODUCTION_ALIAS_HOST }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      SENDILLO_FROM_NUMBER: "+18164876899"
      CANARY_SUMMARY_DIR: canary-run-summary
      CI: "1"

    steps:
      - name: Check required inputs and send window
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
        run: |
          required=(PROD_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY)
          if [[ "$RUN_MODE" == "full" ]]; then
            required+=(SEQUENCE_CANARY_USER_ID SEQUENCE_CANARY_PROPERTY_ID SEQUENCE_CANARY_CONTACT_ID CANARY_APPROVED_SENDILLO_API_KEY CANARY_ADMIN_ACCESS_TOKEN CANARY_PRODUCTION_DEPLOYMENT_URL CANARY_PRODUCTION_ALIAS_HOST VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required inputs: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "$RUN_MODE" == "full" && "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            # Do not turn delayed or queued schedules into catch-up sends.
            now=$(date -u +%s)
            today=$(date -u +%Y-%m-%d)
            due=$(date -u -d "$today 14:17:00 UTC" +%s)
            (( now >= due && now <= due + 600 )) || { echo "Scheduled send window elapsed"; exit 1; }
          fi
          if [[ "$RUN_MODE" == "full" && "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "A full canary run cannot be rerun"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check fresh canary authorization
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        run: npx tsx scripts/check-sequence-canary-control.ts

      - name: Install Vercel CLI
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        run: npm install --global vercel@62.0.0

      - name: Recheck current canary authorization
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        run: npx tsx scripts/check-sequence-canary-control.ts

      - name: Check prior full-run failure latch before enrollment
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        run: npx tsx scripts/check-sequence-canary-failure-latch.ts

      - name: Run Sequences V1 prod canary
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        # Waits for the accepted claim, sent message, authenticated Sendillo
        # delivery webhook, and completed enrollment.
        run: npx tsx scripts/smoke-sequences-prod.ts

      - name: Check runner and reference rows (SELECT only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight-only'
        env:
          PREFLIGHT_MESSAGE_ID: ${{ inputs.message_id }}
          PREFLIGHT_WEBHOOK_EVENT_ID: ${{ inputs.webhook_event_id }}
        run: npx tsx scripts/smoke-sequences-prod.ts --preflight-only --message-id "$PREFLIGHT_MESSAGE_ID" --webhook-event-id "$PREFLIGHT_WEBHOOK_EVENT_ID"

      - name: Clean up tagged canary data
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'full')
        timeout-minutes: 5
        run: npx tsx scripts/smoke-sequences-prod.ts --cleanup-only

      - name: Save redacted run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
        run: |
          mkdir -p canary-run-summary
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "mode=$RUN_MODE"
            echo "status=$JOB_STATUS"
            echo "observed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > canary-run-summary/summary.txt
          cat canary-run-summary/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Retain redacted summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sequence-canary-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-run-summary/
          retention-days: 90
